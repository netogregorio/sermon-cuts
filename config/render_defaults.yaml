# Defaults para todos os renders. Override por mensagem em
# memory/messages/<slug>/overrides.yaml se quiser.

output:
  width: 1080
  height: 1920
  fps: 30

video:
  encoder: libx264
  preset: slow
  crf: 18
  pix_fmt: yuv420p

audio:
  codec: aac
  bitrate: 128k
  target_lufs: -14.0   # padrão Insta/TikTok/Reels

tracking:
  # Detection sampling rate. 2 fps (old default) left ~500ms gaps between
  # detections — a fast gesture or step could leave the crop visibly
  # behind the preacher for that half-second. 5 fps closes those gaps:
  # the smoothing window still hides individual sample jitter, but the
  # tracking now reacts within ~200ms of any real movement.
  # Cost: ~2-3s extra per cut on Apple Silicon (MediaPipe runs at hardware
  # speed). Negligible compared to the visual gain.
  sample_fps: 5.0
  smooth_window_s: 2.5  # janela de média móvel
  detector: mediapipe   # mediapipe | haar
  min_face_size: 80
  # Vertical framing target. 0.40 puts the face center at 40% of the
  # output height — close to the rule-of-thirds horizon, which feels
  # more cinematic than the dead-center default older versions used.
  # Set to null to disable vertical adjustment (renderer just preserves
  # whatever Y framing the source camera used — useful if your stage
  # cam is already well-composed). Range: (0.0, 1.0). Typical values:
  #   0.33 — strong rule-of-thirds, lots of headroom above the face
  #   0.40 — gentle upward bias (default)
  #   0.50 — face centered vertically
  face_y_target: 0.40
  # Y headroom budget for the rule-of-thirds adjustment. Source is
  # scaled to OUT_H * (1 + headroom) tall, giving the crop window
  # vertical slack to position the face. 0.25 = 25% extra (480px at
  # OUT_H=1920); higher = more correction for badly-framed sources but
  # more memory used per frame.
  vertical_headroom: 0.25

subtitle:
  min_words: 3
  max_words: 4
  max_chars: 20
  # Which font preset to burn in. See config/style_presets/README.md for the
  # full list. The default `arial-black` ships on macOS, Windows, and most
  # Linux distros — no extra install needed.
  #   arial-black     → Arial Black (universal default)
  #   helvetica-bold  → Helvetica Bold (macOS-native, slightly lighter)
  #   outfit-black    → Outfit Black (requires manual font install)
  preset: arial-black
  # Optional: force a specific .ttf path if libass can't find the font by name.
  # Leave null to let libass resolve via fontconfig.
  font_path: null

cut_validation:
  min_pause_after_last_token_s: 0.5
  # Default duration window: 60-90s. Gives room for a complete
  # spiritual/emotional/practical arc (hook → development → payoff) without
  # dragging. Aligns with Reels (90s native) and TikTok (no relevant cap)
  # in 2025/2026 — the old "60s sweet spot" reasoning was based on early
  # short-form retention curves that have since shifted.
  #
  # YouTube Shorts still hard-caps at 60s. To produce a Shorts-safe cut,
  # run with --target shorts on 04_propose_cuts / 05_validate_cut (or
  # pipeline.sh --target shorts). That re-applies shorts_max_duration_s
  # as the ceiling and tells the LLM to stay under it.
  min_duration_s: 60
  max_duration_s: 90
  shorts_max_duration_s: 60            # ceiling when --target=shorts
  forbid_endings:                      # se cut termina nessas palavras, INVALID
    - porque
    - mas
    - e
    - que
    - para
    - de
    - com
    - em
    - então                            # "então..." sinaliza próxima sentença
    - quando                           # "quando..." abre subordinada incompleta
    - se                               # "se..." abre condicional incompleta
  forbid_starts:                       # primeira palavra do cut em qualquer dessas → flag
    # Indica que o cut começou no meio de uma sentença/raciocínio anterior.
    # 05_validate_cut só ALERTA (não auto-move) — mover o start do cut
    # invalida a curadoria deliberada do LLM/humano sobre onde a ideia começa.
    # O fix é editorial: re-pedir o cut com start alinhado a uma fronteira de
    # sentença completa.
    - mas
    - porque
    - e
    - que
    - então
    - quando
    - se
    - para
    - ou
    - como
    - aí
  required_terminal_punct: ".!?"       # cue final ideal termina em uma dessas

# Caminho do binário ffmpeg. null = usar o `ffmpeg` do PATH.
# Override pra um build com libass habilitada (ex: /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg)
# se o ffmpeg padrão do sistema não suportar burned subtitles.
ffmpeg_bin: null
